[workspace]
provider = "opencode"

[providers]
[providers.opencode]
base = "builtin:opencode"
ready_delay_ms = 0

[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.factory]
source = "../packs/lessons/L2"

[[rigs]]
name = "rig"
default_branch = "main"
[rigs.imports]
[rigs.imports.factory]
source = "../packs/lessons/L2"

[session]
startup_timeout = "3m"

[daemon]
formula_v2 = true
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"
